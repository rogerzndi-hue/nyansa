services:
  - type: web
    name: nyansa
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: 'off'

    buildCommand: pip install .
    startCommand: cd backend && python -m uvicorn nyansa.api:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    envVars:
      - key: NYANSA_AUTH_MODE
        value: public
      - key: NYANSA_MODE
        value: live

      - key: NYANSA_SOURCES
        value: /etc/secrets/sources.json

      - key: NYANSA_DATA_DIR
        value: /tmp/nyansa

      - key: NYANSA_COLLECT_INTERVAL
        value: "900"
