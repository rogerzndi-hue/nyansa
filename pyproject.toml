[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyansa"
version = "0.1.0"
description = "Plateforme de renseignement sur les risques et menaces en Afrique"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx2>=2",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["nyansa*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
