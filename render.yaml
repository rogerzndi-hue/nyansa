services:
  - type: web
    name: nyansa
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    autoDeployTrigger: 'off'

    buildCommand: pip install .
    startCommand: cd backend && python -m uvicorn nyansa.api:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    disk:
      name: nyansa-data
      mountPath: /var/data/nyansa
      sizeGB: 10

    envVars:
      - key: NYANSA_MODE
        value: live

      - key: NYANSA_SOURCES
        value: /etc/secrets/sources.json

      - key: NYANSA_DATA_DIR
        value: /var/data/nyansa

      - key: NYANSA_COLLECT_INTERVAL
        value: "900"
